server {
    listen 80;
    server_name pengh5.moban8.top;

    root /www/wwwroot/pengh5.moban8.top;
    index index.html;

    include /www/server/panel/vhost/nginx/extension/pengh5.moban8.top/*.conf;
    include /www/server/panel/vhost/nginx/well-known/pengh5.moban8.top.conf;

    location = /admin {
        return 301 /admin/;
    }

    location ^~ /admin/ {
        try_files $uri $uri/ /admin/index.html;
    }

    location ^~ /assets_new/ {
        alias /www/wwwroot/pengh5.moban8.top/admin/assets_new/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location ^~ /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location ^~ /static/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /api {
        rewrite ^(.*)$ /index.php?s=$1 last;
    }

    location /auth {
        rewrite ^(.*)$ /index.php?s=$1 last;
    }

    location /ai-content {
        rewrite ^(.*)$ /index.php?s=$1 last;
    }

    location = /index.php {
        include fastcgi_params;
        fastcgi_pass unix:/tmp/php-cgi-83.sock;
        fastcgi_param SCRIPT_FILENAME /www/wwwroot/pengpeng.moban8.top/public/index.php;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_connect_timeout 60s;
        fastcgi_send_timeout 300s;
        fastcgi_read_timeout 300s;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
    }

    location ~ ^/(\.user\.ini|\.htaccess|\.git|\.env|\.svn) {
        return 404;
    }

    location ~ /\. {
        deny all;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    access_log /www/wwwlogs/pengh5.moban8.top.log;
    error_log /www/wwwlogs/pengh5.moban8.top.error.log;
}
