<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>完成任务领奖励 · 小魔推</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;background:linear-gradient(135deg,#ff9a9e 0%,#fad0c4 100%);min-height:100vh;color:#333;padding:20px}
  .container{max-width:480px;margin:0 auto}
  .card{background:#fff;border-radius:20px;padding:24px;box-shadow:0 10px 40px rgba(0,0,0,0.1);margin-bottom:16px}
  .title{font-size:20px;font-weight:700;color:#ff6b6b;text-align:center;margin-bottom:4px}
  .subtitle{font-size:12px;color:#999;text-align:center;margin-bottom:20px}
  .progress-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;padding:12px 16px;background:#fff8f8;border-radius:12px;font-size:13px;color:#666}
  .count{font-weight:700;color:#ff6b6b;font-size:18px}
  .actions{display:grid;gap:12px;margin-bottom:16px}
  .action{padding:16px;border:2px solid #ffe4e4;border-radius:14px;background:#fff;cursor:pointer;transition:all .2s}
  .action:active{transform:scale(0.98)}
  .action.completed{border-color:#2c9b4f;background:#f0fff4}
  .action.started{border-color:#ffa500;background:#fff8e8}
  .action-name{font-weight:600;font-size:15px;margin-bottom:4px;display:flex;justify-content:space-between;align-items:center}
  .state-tag{font-size:11px;padding:2px 8px;border-radius:10px}
  .state-PENDING{background:#f5f5f5;color:#999}
  .state-STARTED{background:#fff3e0;color:#ef6c00}
  .state-VERIFYING{background:#e3f2fd;color:#1565c0}
  .state-COMPLETED{background:#e8f7ec;color:#2c9b4f}
  .action-meta{font-size:12px;color:#888;line-height:1.6}
  .action-btn{margin-top:10px;padding:10px;width:100%;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer}
  .btn-primary{background:#ff6b6b;color:#fff}
  .btn-secondary{background:#f0f0f5;color:#666}
  .scheme-link{display:inline-block;margin-top:8px;padding:6px 10px;background:#fff5f5;border:1px dashed #ff9999;border-radius:6px;color:#c0392b;font-size:12px;text-decoration:none;font-family:monospace;word-break:break-all}
  .copy-text{background:#fafafa;padding:8px 10px;border-radius:6px;font-size:13px;font-family:monospace;margin-top:8px;color:#333;display:flex;justify-content:space-between;align-items:center}
  .copy-btn{padding:4px 8px;background:#ff6b6b;color:#fff;border:none;border-radius:4px;font-size:11px;cursor:pointer}
  .guide{font-size:12px;color:#888;line-height:1.7;margin-top:10px;padding:10px;background:#fafafa;border-radius:8px}
  .guide li{margin-left:18px}
  .reward-section{padding:18px;background:linear-gradient(135deg,#fff5e6,#ffe6e6);border-radius:14px;text-align:center;margin-bottom:16px}
  .reward-icon{font-size:36px;margin-bottom:6px}
  .reward-title{font-size:16px;font-weight:700;color:#d35400}
  .reward-desc{font-size:12px;color:#999;margin-top:4px}
  .reward-claim{margin-top:12px;padding:12px;background:linear-gradient(135deg,#ff6b6b,#ee5a52);color:#fff;border:none;border-radius:24px;font-size:15px;font-weight:700;cursor:pointer;width:100%}
  .reward-claim:disabled{opacity:.5}
  .reward-status{margin-top:10px;padding:8px;border-radius:8px;font-size:13px;display:none}
  .reward-status.show{display:block}
  .reward-status.ISSUED{background:#e8f7ec;color:#2c9b4f}
  .reward-status.FAILED{background:#ffe8e8;color:#c0392b}
  .reward-status.PENDING{background:#fff3e0;color:#ef6c00}
  .loading,.empty{text-align:center;padding:40px;color:#999;font-size:13px}
  .footer{text-align:center;color:rgba(0,0,0,0.3);font-size:11px;margin-top:20px}
  .toast{position:fixed;top:30%;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.85);color:#fff;padding:14px 24px;border-radius:10px;font-size:14px;display:none;z-index:99;max-width:80%;text-align:center}
  .toast.show{display:block;animation:fadeIn .2s}
  @keyframes fadeIn{from{opacity:0;transform:translate(-50%,-10px)}to{opacity:1;transform:translate(-50%,0)}}
  .spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,0.3);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite;margin-right:6px;vertical-align:middle}
  @keyframes spin{to{transform:rotate(360deg)}}
  textarea.copy-area{width:100%;min-height:60px;padding:8px;font-family:monospace;font-size:12px;border:1px dashed #ccc;border-radius:6px;margin-top:6px;background:#fff}
</style>
</head>
<body>
<div class="container">
  <div class="card">
    <div class="title" id="bundleTitle">任务详情</div>
    <div class="subtitle" id="bundleSubtitle">加载中...</div>
    <div class="progress-row">
      <span>完成进度</span>
      <span class="count"><span id="completed">0</span> / <span id="total">0</span></span>
    </div>
    <div class="actions" id="actions"><div class="empty">加载中...</div></div>
  </div>

  <div class="reward-section">
    <div class="reward-icon">🎁</div>
    <div class="reward-title" id="rewardTitle">完成任务领取奖励</div>
    <div class="reward-desc" id="rewardDesc">全部完成后可领取</div>
    <button class="reward-claim" id="claimBtn" disabled>领取奖励</button>
    <div class="reward-status" id="rewardStatus"></div>
  </div>
  <div class="footer">小魔推 · 碰一碰任务 · 测试环境</div>
</div>
<div class="toast" id="toast"></div>

<script>
const API = '';
const params = new URLSearchParams(location.search);
const ti = params.get('ti') || '';
const device = params.get('device') || '';
let instanceData = null;

function showToast(msg, ms=2000) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), ms);
}

function esc(s) { return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

async function loadInstance() {
  if (!ti) { showToast('缺少任务实例 ID'); return; }
  try {
    const r = await fetch(API + '/api/task/instance/' + ti);
    const json = await r.json();
    if (json.code !== 200) { showToast('加载失败：' + json.msg); return; }
    instanceData = json.data;
    render();
  } catch (e) { showToast('网络错误：' + e.message); }
}

function render() {
  const { instance, bundle, actions } = instanceData;
  document.getElementById('bundleTitle').textContent = bundle.title;
  document.getElementById('bundleSubtitle').textContent = bundle.subtitle || (bundle.bundle_name || '');
  document.getElementById('completed').textContent = instance.completed_count || 0;
  document.getElementById('total').textContent = actions.length;

  const rewardMap = { points: '积分奖励', coupon: '优惠券', redpacket: '红包', none: '无奖励' };
  const rewardType = bundle.reward_type || 'none';
  document.getElementById('rewardTitle').textContent = (rewardMap[rewardType] || '奖励') + ' · 完成即可领取';
  document.getElementById('rewardDesc').textContent = bundle.reward_type === 'points' ? '奖励将自动发放到当前账号' : '请在有效期内领取';

  const aList = document.getElementById('actions');
  if (!actions.length) { aList.innerHTML = '<div class="empty">暂无任务动作</div>'; return; }

  aList.innerHTML = '';
  actions.forEach(a => {
    const div = document.createElement('div');
    div.className = 'action ' + (a.state === 'COMPLETED' ? 'completed' : a.state === 'STARTED' || a.state === 'VERIFYING' ? 'started' : '');
    const card = a.card || {};
    let html = `
      <div class="action-name">
        <span>${esc(a.action_name)}</span>
        <span class="state-tag state-${esc(a.state)}">${esc(a.state)}</span>
      </div>
      <div class="action-meta">${esc(a.plugin_key)}${a.required ? ' · 必做' : ''}</div>
    `;
    if (a.state === 'PENDING') {
      html += `<button class="action-btn btn-primary" data-act="start" data-id="${a.id}">开始任务 →</button>`;
    } else if (a.state === 'STARTED' || a.state === 'VERIFYING') {
      if (card.scheme_url) html += `<a class="scheme-link" href="${esc(card.scheme_url)}">${esc(card.scheme_url)}</a>`;
      if (card.copy_text) {
        html += `<div class="copy-text">${esc(card.copy_text)}<button class="copy-btn" data-act="copy" data-text="${esc(card.copy_text)}">复制</button></div>`;
      }
      if (a.need_proof) {
        html += `<button class="action-btn btn-primary" data-act="proof" data-id="${a.id}">📷 上传截图凭证</button>`;
      } else {
        html += `<button class="action-btn btn-primary" data-act="claim-action" data-id="${a.id}">✅ 已完成（直接标记完成）</button>`;
      }
      if (card.guide_steps && card.guide_steps.length) {
        html += `<div class="guide"><ol>${card.guide_steps.map(s => `<li>${esc(s)}</li>`).join('')}</ol></div>`;
      }
    } else if (a.state === 'COMPLETED') {
      html += `<div class="action-meta" style="color:#2c9b4f">✅ 已完成</div>`;
    }
    div.innerHTML = html;
    aList.appendChild(div);
  });

  // 绑定事件
  aList.querySelectorAll('[data-act="start"]').forEach(b => {
    b.onclick = () => startAction(b.dataset.id);
  });
  aList.querySelectorAll('[data-act="proof"]').forEach(b => {
    b.onclick = () => uploadProof(b.dataset.id);
  });
  aList.querySelectorAll('[data-act="claim-action"]').forEach(b => {
    b.onclick = () => quickClaimAction(b.dataset.id);
  });
  aList.querySelectorAll('[data-act="copy"]').forEach(b => {
    b.onclick = () => copyText(b.dataset.text);
  });

  // 奖励按钮
  const claimBtn = document.getElementById('claimBtn');
  if (instance.status === 'COMPLETED' && instance.reward_status === 'PENDING') {
    claimBtn.disabled = false;
    claimBtn.textContent = '领取奖励 →';
  } else if (instance.reward_status === 'ISSUED') {
    claimBtn.disabled = true;
    claimBtn.textContent = '✓ 已领取';
  } else if (instance.reward_status === 'FAILED') {
    claimBtn.disabled = true;
    claimBtn.textContent = '领取失败';
  }
  const status = document.getElementById('rewardStatus');
  if (instance.reward_status && instance.reward_status !== 'PENDING') {
    status.className = 'reward-status show ' + instance.reward_status;
    if (instance.reward_status === 'ISSUED') status.textContent = '✅ 奖励已发放：' + JSON.stringify(instance.reward_data || {});
    else if (instance.reward_status === 'FAILED') status.textContent = '❌ ' + (instance.reward_data?.error || '发放失败');
  }
}

async function startAction(actionId) {
  try {
    const r = await fetch(API + '/api/task/instance/' + ti + '/action/' + actionId + '/start', { method: 'POST' });
    const json = await r.json();
    if (json.code === 200) {
      showToast('已开始任务');
      await loadInstance();
    } else {
      showToast('开始失败：' + json.msg);
    }
  } catch (e) { showToast(e.message); }
}

async function uploadProof(actionId) {
  // 简化：用 picsum 图片占位作为截图
  showToast('正在上传截图...', 3000);
  try {
    const r = await fetch(API + '/api/task/instance/' + ti + '/action/' + actionId + '/proof', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        file_url: 'https://picsum.photos/400/600?t=' + Date.now(),
        file_hash: 'hash_' + Date.now(),
        note: 'web test proof'
      })
    });
    const json = await r.json();
    if (json.code === 200) {
      showToast('✅ 凭证已提交，等待审核（自动通过）', 2500);
      // 自动审核通过（需要 admin token）
      await autoAudit(json.data.proof_id);
      await loadInstance();
    } else {
      showToast('上传失败：' + json.msg);
    }
  } catch (e) { showToast(e.message); }
}

async function autoAudit(proofId) {
  try {
    const token = localStorage.getItem('admin_token');
    if (!token) {
      showToast('⚠️ 需要 admin token 才能自动审核', 3000);
      return;
    }
    await fetch(API + '/api/task/proof/' + proofId + '/audit', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
      body: JSON.stringify({ result: 'approved', remark: 'web auto-approve' })
    });
  } catch (e) {}
}

async function quickClaimAction(actionId) {
  // claim_coupon 类（无需凭证）的动作触发
  showToast('已标记完成，等待后端处理', 2000);
  await loadInstance();
}

async function claimReward() {
  const btn = document.getElementById('claimBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>领取中...';
  try {
    const r = await fetch(API + '/api/task/instance/' + ti + '/claim-reward', { method: 'POST' });
    const json = await r.json();
    if (json.code === 200) {
      showToast('🎉 奖励发放成功！', 2500);
      await loadInstance();
    } else {
      showToast('领取失败：' + json.msg);
      btn.disabled = false;
      btn.textContent = '领取奖励 →';
    }
  } catch (e) {
    showToast(e.message);
    btn.disabled = false;
    btn.textContent = '领取奖励 →';
  }
}

function copyText(t) {
  navigator.clipboard.writeText(t).then(() => showToast('已复制'));
  // fallback
  const ta = document.createElement('textarea');
  ta.value = t;
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); } catch (e) {}
  document.body.removeChild(ta);
}

document.getElementById('claimBtn').onclick = claimReward;
loadInstance();
</script>
</body>
</html>
